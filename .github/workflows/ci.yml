# Tests the cog against Quarz's main branch, built from source. (The
# test against a real KMS reads AWS_TEST_KMS_KEY_ID and is not run here.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so that a change on Quarz's main that breaks the cog shows.
    - cron: "37 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tasks on several workers, as the credentials cache's tests need to show.
      QUARZ_THREADS: 4
    steps:
      - name: Check out this cog
        uses: actions/checkout@v7
      - name: Check out Quarz (main), to build it
        uses: actions/checkout@v7
        with:
          repository: quarz-lang/quarz
          path: .quarz
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .quarz
      - name: Build Quarz
        run: |
          cargo build --release --manifest-path .quarz/Cargo.toml
          echo "$GITHUB_WORKSPACE/.quarz/target/release" >> "$GITHUB_PATH"
      - name: Check
        run: quarz check
      - name: Test (interpreted)
        run: quarz test
      - name: Test (compiled)
        run: quarz test --release
      - name: Doc examples
        run: quarz test --doc
      - name: Docs
        run: quarz doc --check
